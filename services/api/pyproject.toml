[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot AI - local-first career operating system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic>=2.6", "pydantic-settings>=2.2", "httpx>=0.27", "python-multipart",
  "cryptography>=42", "apscheduler>=3.10", "pymupdf>=1.24", "python-docx>=1.1",
  "striprtf", "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
ocr = ["pytesseract", "pillow"]
agents = ["langgraph", "litellm"]
browser = ["playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
