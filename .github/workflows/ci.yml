name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e "services/api[dev]"
      # The default rule set of current ruff flags ~600 style findings in existing code (see
      # docs/TEST_STRATEGY.md); the blocking gate is syntax/undefined-name errors only.
      - run: python -m ruff check --isolated --select E9,F63,F7,F82 services/api scripts tests
      - name: Alembic upgrade
        working-directory: services/api
        run: python -m alembic upgrade heads
      - name: pytest
        working-directory: services/api
        run: python -m pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/scan_secrets.py
  audits:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python -m pip install pip-audit -e services/api
      - run: pip-audit
        continue-on-error: true
      - run: npm audit --audit-level=high
        working-directory: apps/web
        continue-on-error: true
